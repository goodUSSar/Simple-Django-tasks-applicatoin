services:
  web:
    build:
      context: .
    image: simple-django-tasks:dev

    env_file:
      - .env

    environment:
      DJANGO_DATABASE_PATH: /app/data/db.sqlite3

    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - django_data:/app/data

volumes:
  django_data:
